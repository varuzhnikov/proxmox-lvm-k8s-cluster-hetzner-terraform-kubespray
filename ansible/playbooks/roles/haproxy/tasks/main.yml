---
- name: Install HAProxy package
  apt:
    name: haproxy
    state: present
    update_cache: yes
  become: yes

- name: Ensure HAProxy configuration directory exists
  file:
    path: /etc/haproxy
    state: directory
    mode: '0755'
  become: yes

- name: Check if allow_domains.txt exists locally
  stat:
    path: "{{ role_path }}/files/allow_domains.txt"
  register: allow_domains_local_file
  delegate_to: localhost
  run_once: true

- name: Display error message if allow_domains.txt is missing
  debug:
    msg:
      - ""
      - "============================================================================"
      - "ERROR: File allow_domains.txt is required but not found locally!"
      - "============================================================================"
      - ""
      - "Please create the file locally before deploying:"
      - "  {{ role_path }}/files/allow_domains.txt"
      - ""
      - "You can use the example file as a reference:"
      - "  cp {{ role_path }}/files/allow_domains.txt.example {{ role_path }}/files/allow_domains.txt"
      - "  vi {{ role_path }}/files/allow_domains.txt"
      - "  Or use: nano {{ role_path }}/files/allow_domains.txt (if you prefer)"
      - ""
      - "Format: One domain per line"
      - "  - Exact domain: example.com"
      - "  - Wildcard: .example.com (with leading dot, matches *.example.com)"
      - ""
      - "Example content:"
      - "  example.com"
      - "  www.example.com"
      - "  .example.com"
      - ""
      - "After creating the file locally, run this playbook again."
      - "============================================================================"
      - ""
  when: not allow_domains_local_file.stat.exists
  delegate_to: localhost
  run_once: true
  failed_when: false

- name: Fail if allow_domains.txt is missing locally
  fail:
    msg: "File allow_domains.txt is required. See error message above for details."
  when: not allow_domains_local_file.stat.exists
  delegate_to: localhost
  run_once: true

- name: Display error message if allow_domains.txt is empty
  debug:
    msg:
      - ""
      - "============================================================================"
      - "ERROR: File allow_domains.txt exists locally but is empty!"
      - "============================================================================"
      - ""
      - "Please add at least one allowed domain to:"
      - "  {{ role_path }}/files/allow_domains.txt"
      - ""
      - "Format: One domain per line"
      - "  - Exact domain: example.com"
      - "  - Wildcard: .example.com (with leading dot, matches *.example.com)"
      - ""
      - "Example content:"
      - "  example.com"
      - "  www.example.com"
      - "  .example.com"
      - "============================================================================"
      - ""
  when: allow_domains_local_file.stat.exists and allow_domains_local_file.stat.size == 0
  delegate_to: localhost
  run_once: true
  failed_when: false

- name: Fail if allow_domains.txt is empty locally
  fail:
    msg: "File allow_domains.txt is empty. See error message above for details."
  when: allow_domains_local_file.stat.exists and allow_domains_local_file.stat.size == 0
  delegate_to: localhost
  run_once: true

- name: Copy allow_domains.txt to Proxmox host
  copy:
    src: allow_domains.txt
    dest: /etc/haproxy/allow_domains.txt
    mode: '0644'
  become: yes
  notify: reload haproxy

- name: Copy HAProxy configuration file to temporary location
  copy:
    src: haproxy.cfg
    dest: "{{ haproxy_config_path }}.tmp"
    mode: '0644'
  become: yes

- name: Validate HAProxy configuration from temporary file
  command: haproxy -c -f "{{ haproxy_config_path }}.tmp"
  register: haproxy_config_check
  changed_when: false
  failed_when: haproxy_config_check.rc != 0
  become: yes

- name: Replace HAProxy configuration file after successful validation
  copy:
    src: "{{ haproxy_config_path }}.tmp"
    dest: "{{ haproxy_config_path }}"
    mode: '0644'
    # Create backup of existing config before overwriting
    # Backup files are stored with timestamp suffix (e.g., haproxy.cfg.2024-01-01@12:00:00~)
    # This allows rollback if the new config causes runtime issues after deployment
    backup: yes
    remote_src: yes
  become: yes
  notify: reload haproxy

- name: Remove temporary HAProxy configuration file
  file:
    path: "{{ haproxy_config_path }}.tmp"
    state: absent
  become: yes

- name: Enable and start HAProxy service
  systemd:
    name: "{{ haproxy_service }}"
    enabled: yes
    state: started
  become: yes
