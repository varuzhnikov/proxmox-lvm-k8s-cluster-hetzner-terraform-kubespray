---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-cluster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Sync wave: 2 - Install PostgreSQL cluster after operator (sync-wave: "1")
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/description: "PostgreSQL cluster managed by CloudNativePG"
spec:
  project: default
  
  source:
    # Git repository containing the PostgreSQL cluster manifest
    repoURL: https://github.com/varuzhnikov/proxmox-lvm-k8s-cluster-hetzner-terraform-kubespray  # REPLACE with your repository
    targetRevision: part_9  # Or master, or specific tag/commit
    path: examples/argocd/applications/monitoring
    directory:
      # Only include postgres-cluster.yaml, exclude operator and app manifests
      include: "postgres-cluster.yaml"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: false      # Don't auto-delete resources
      selfHeal: true    # Auto-fix deviations from Git
    syncOptions:
      - CreateNamespace=true  # Automatically create namespace
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
