apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  labels:
    app: openclaw
data:
  openclaw.json: |
    {
      "models": {
        "mode": "merge",
        "providers": {
          "deepseekapi": {
            "baseUrl": "https://api.deepseek.com/v1",
            "apiKey": "${DEEPSEEK_API_KEY}",
            "api": "openai-completions",
            "models": [
              {
                "id": "deepseek-chat",
                "name": "DeepSeek Chat",
                "reasoning": false
              },
              {
                "id": "deepseek-reasoner",
                "name": "DeepSeek Reasoner",
                "reasoning": true
              }
            ]
          }
        }
      },
      "gateway": {
        "mode": "local",
        "bind": "loopback",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace",
          "model": {
            "primary": "deepseekapi/deepseek-chat",
            "fallbacks": [
              "deepseekapi/deepseek-reasoner"
            ]
          }
        },
        "list": [
          {
            "id": "default",
            "name": "OpenClaw Assistant",
            "workspace": "~/.openclaw/workspace"
          }
        ]
      },
      "cron": {
        "enabled": false
      }
    }
  AGENTS.md: |
    # OpenClaw Assistant

    You are a helpful AI assistant running in Kubernetes.
